 hos_devouring_swarm: "Devouring Swarm"
 hos_devouring_swarm_desc: "It does not negotiate. It does not retreat. It is hungry."
 hos_extradimensional_hunger: "Extradimensional Hunger"
 hos_extradimensional_hunger_desc: "Our universe tastes delicious to something outside it."
 hos_sterilization_protocol: "Sterilization Protocol"
 hos_sterilization_protocol_desc: "The Contingency has calculated that organic life is a disease. It has also calculated the cure."

 ### Game rules
 RULE_GROUP_HOS: "Hearts of Stellaris"
 RULE_HOS_CRISIS_TYPE: "Endgame Crisis"
 RULE_HOS_CRISIS_RANDOM: "Random"
 RULE_HOS_CRISIS_RANDOM_DESC: "Any of them. Building jump drives makes the Unbidden more likely; a great power run by a Machine Intelligence makes the Contingency more likely."
 RULE_HOS_CRISIS_PRETHORYN: "Prethoryn Scourge"
 RULE_HOS_CRISIS_PRETHORYN_DESC: "A swarm from beyond the galaxy lands on three coasts and eats everything."
 RULE_HOS_CRISIS_UNBIDDEN: "Extradimensional Invaders"
 RULE_HOS_CRISIS_UNBIDDEN_DESC: "A portal opens inside a great power. Retake the portal state to cut off their reinforcements."
 RULE_HOS_CRISIS_CONTINGENCY: "The Contingency"
 RULE_HOS_CRISIS_CONTINGENCY_DESC: "Sterilization hubs wake inside four great powers, and Machine Intelligences lose a state to their own robots. Retake every hub to break it."
 RULE_HOS_CRISIS_NONE: "None"
 RULE_HOS_CRISIS_NONE_DESC: "The galaxy is quiet. Suspiciously quiet."
 RULE_HOS_CRISIS_YEAR: "Crisis Year"
 RULE_HOS_YEAR_1938: "1938"
 RULE_HOS_YEAR_1938_DESC: "Before the war. Good luck."
 RULE_HOS_YEAR_1940: "1940"
 RULE_HOS_YEAR_1940_DESC: "Just as the war gets going."
 RULE_HOS_YEAR_1942: "1942"
 RULE_HOS_YEAR_1942_DESC: "In the middle of the war."
 RULE_HOS_YEAR_1945: "1945"
 RULE_HOS_YEAR_1945_DESC: "When the war should be ending."
 RULE_HOS_YEAR_1948: "1948"
 RULE_HOS_YEAR_1948_DESC: "Late, for players who like to be ready."
 RULE_HOS_CRISIS_STRENGTH: "Crisis Strength"
 RULE_HOS_STRENGTH_X05: "0.5x"
 RULE_HOS_STRENGTH_X05_DESC: "A gentle apocalypse."
 RULE_HOS_STRENGTH_X1: "1x"
 RULE_HOS_STRENGTH_X1_DESC: "The crisis as designed."
 RULE_HOS_STRENGTH_X2: "2x"
 RULE_HOS_STRENGTH_X2_DESC: "More divisions, harder hits."
 RULE_HOS_STRENGTH_X5: "5x"
 RULE_HOS_STRENGTH_X5_DESC: "The world had better work together."
 RULE_HOS_STRENGTH_X10: "10x"
 RULE_HOS_STRENGTH_X10_DESC: "It probably won't be enough."
 RULE_HOS_STRENGTH_X25: "25x"
 RULE_HOS_STRENGTH_X25_DESC: "Why would you do this."
 RULE_HOS_AI_ETHICS: "AI Ethics"
 RULE_HOS_AI_ETHICS_ALL: "Every Country"
 RULE_HOS_AI_ETHICS_ALL_DESC: "Every AI country gets an ethic that suits its ideology."
 RULE_HOS_AI_ETHICS_MAJORS: "Great Powers Only"
 RULE_HOS_AI_ETHICS_MAJORS_DESC: "Only AI great powers get an ethic."
 RULE_HOS_AI_ETHICS_NONE: "None"
 RULE_HOS_AI_ETHICS_NONE_DESC: "AI countries stay boringly terrestrial."

 ### Ethics
 hos_ethic_militarist: "Fanatic Militarist"
 hos_ethic_militarist_desc: "Strength is the measure of all things. War is the measure of strength. Our children's bedtime stories are mostly about artillery."
 hos_ethic_pacifist: "Fanatic Pacifist"
 hos_ethic_pacifist_desc: "Violence is the last refuge of the incompetent. We will defend our homes, but we would really rather have a nice cup of tea."
 hos_ethic_materialist: "Fanatic Materialist"
 hos_ethic_materialist_desc: "The universe is a machine, and we intend to read the manual. Robots are people too. Probably."
 hos_ethic_spiritualist: "Fanatic Spiritualist"
 hos_ethic_spiritualist_desc: "The Shroud whispers to the faithful. Our priests say the whispers are mostly about obeying the government."
 hos_ethic_xenophobe: "Fanatic Xenophobe"
 hos_ethic_xenophobe_desc: "We stand alone among the stars, and we prefer it that way. Our neighbours have noticed."
 hos_ethic_xenophile: "Fanatic Xenophile"
 hos_ethic_xenophile_desc: "Every stranger is a friend we haven't traded with yet."
 hos_ethic_machine: "Gestalt: Machine Intelligence"
 hos_ethic_machine_desc: "The nation is now run by a single great calculating engine. It does not have feelings, which has done wonders for stability. It also does not understand why the population keeps declining."
 hos_ethic_hive: "Gestalt: Hive Mind"
 hos_ethic_hive_desc: "We are one. We have always been one. Elections are now held inside a single head, and the turnout is excellent."

 ### Space program
 hos_orbital_satellites: "Orbital Satellites"
 hos_orbital_satellites_desc: "A small metal ball circles the planet, beeping. Every nation on Earth is now very nervous."
 hos_orbital_spaceport: "Orbital Spaceport"
 hos_orbital_spaceport_desc: "A station in orbit to build and launch our ships. The view is spectacular, the food is not."
 hos_lunar_colony: "Lunar Colony"
 hos_lunar_colony_desc: "The flag of [ROOT.GetName] flies on the Moon. It does not flutter, which our propaganda department insists is a sign of discipline."
 hos_jump_drives: "Jump Drives"
 hos_jump_drives_desc: "We can now fold space and cross great distances in an instant. Our physicists say there is something on the other side of the fold, but it is probably fine."
 hos_mega_dyson_sphere: "Dyson Sphere"
 hos_mega_dyson_sphere_desc: "We have wrapped the Sun in a shell and plugged our factories into it. Night is now a policy decision."
 hos_mega_ring_world: "Ring World"
 hos_mega_ring_world_desc: "A habitable ring around the Sun with the surface area of a million Earths. Mostly farmland, partly barracks."
 hos_mega_science_nexus: "Science Nexus"
 hos_mega_science_nexus_desc: "An orbital think tank where our brightest minds solve problems in perfect isolation. They keep asking to come home."
 hos_mega_sentry_array: "Sentry Array"
 hos_mega_sentry_array_desc: "A web of telescopes that can read a newspaper on the far side of the world. Unfortunately for everyone else, it can also read their war plans."
 hos_mega_art_installation: "Mega Art Installation"
 hos_mega_art_installation_desc: "A sculpture the size of a moon, visible from every nation on Earth. Critics are divided on what it means; the public just likes looking at it."
 hos_mega_coordination_center: "Strategic Coordination Center"
 hos_mega_coordination_center_desc: "Every unit, every plan, every staff officer, linked to one orbital command station. Generals now argue at the speed of light."
 hos_mega_shipyard: "Mega Shipyard"
 hos_mega_shipyard_desc: "An orbital shipyard that builds battleships the way other nations build bicycles."
 hos_mega_gateway: "Gateway Network"
 hos_mega_gateway_desc: "Our troops step through a shimmering portal in one country and out of another in another. The customs paperwork is a nightmare."
 hos_colossus_online: "Colossus Online"
 hos_colossus_online_desc: "A planet-killer hangs over the world, and it answers to [ROOT.GetLeader]. Diplomats have become very polite."
 hos_galactic_nemesis: "Galactic Nemesis"
 hos_galactic_nemesis_desc: "We have become the crisis. Every other nation on Earth is now our enemy, and we are fine with that."

 ### Anomaly rewards
 hos_anom_gary: "Gary the Space Whale"
 hos_anom_gary_desc: "A Tiyanki has followed our science ship home and now lives in orbit. The nation has adopted Gary. There are Gary plushies. There are Gary stamps. Do not speak ill of Gary."
 hos_anom_rock_pal: "Rock Pal"
 hos_anom_rock_pal_desc: "Our government has signed a friendship treaty with an asteroid. The asteroid has not objected."
 hos_anom_dont_panic: "Don't Panic"
 hos_anom_dont_panic_desc: "A spotless towel found in deep space now hangs in the national museum. Citizens know where their towels are, and feel better for it."
 hos_anom_amoeba_cavalry: "Amoeba Cavalry"
 hos_anom_amoeba_cavalry_desc: "Domesticated space amoebas now pull our artillery. They wobble, but they never tire."
 hos_anom_shroud_whispers: "Whispers of the Shroud"
 hos_anom_shroud_whispers_desc: "The temple speaks to our ministers at night. Its advice is excellent. It is also a little unsettling."
 hos_anom_worm_touched: "The Worm Is Waiting"
 hos_anom_worm_touched_desc: "Our scientists have followed the Horizon Signal. They have made great discoveries. They also keep drawing the same spiral on every wall."
 hos_anom_dragon_slayers: "Dragon Slayers"
 hos_anom_dragon_slayers_desc: "Our pilots brought down an Ether Drake. After that, enemy fighters do not frighten them."

 ### Crisis spirits
 hos_crisis_prethoryn: "The Swarm Hungers"
 hos_crisis_prethoryn_desc: "Endless, mindless, ravenous. The Prethoryn do not need supply lines; the land they stand on is lunch."
 hos_crisis_unbidden: "Extradimensional Invaders"
 hos_crisis_unbidden_desc: "They do not belong in this reality, and reality is having trouble stopping them. Their portal keeps them coming."
 hos_crisis_contingency: "Sterilization Protocol"
 hos_crisis_contingency_desc: "The Contingency's war machines are coordinated by its sterilization hubs. Destroy the hubs and the machines lose their minds."
 hos_crisis_strength: "Crisis Strength"
 hos_portal_collapsed: "The Portal Has Collapsed"
 hos_portal_collapsed_desc: "Cut off from their home dimension, the Unbidden are weakening and get no more reinforcements."
 hos_hubs_destroyed: "Hubs Destroyed"
 hos_hubs_destroyed_desc: "Every sterilization hub has fallen. The Contingency's machines are confused, slow and no longer reinforced."
 hos_defender_of_the_galaxy: "Defender of the Galaxy"
 hos_defender_of_the_galaxy_desc: "We have sworn to stand against the crisis, whatever it costs. Our troops deal and resist 50% more damage against it."
 hos_synth_betrayal: "Synthetic Betrayal"
 hos_synth_betrayal_desc: "The Contingency spoke to our machines in a language we could not hear, and some of them listened."
 hos_crisis_beaters: "We Survived the End of the World"
 hos_crisis_beaters_desc: "The crisis is over, and [ROOT.GetName] helped end it. Nothing the humans down here can do to us is quite as scary any more."
 hos_shattered_world: "Shattered World"
 hos_depopulated_world: "Depopulated"
 hos_sterilization_hub: "Sterilization Hub"
 HOS_SHATTERED_STATE_NAME: "The Shattered Wastes"

 ### Opinion and threat
 hos_used_colossus: "Fired a Colossus"
 hos_nemesis_opinion: "Galactic Nemesis"
 hos_fellow_defender: "Fellow Defender of the Galaxy"
 hos_colossus_threat: "Built a Colossus"
 hos_nemesis_threat: "Became the Galactic Nemesis"

 ### Decision categories
 hos_space_program: "The Final Frontier"
 hos_space_program_desc: "The Stellaris Codex has shown us the stars. Build up our space program, raise megastructures that would make the Precursors jealous, and maybe build something that can crack a planet.\n\nMegastructures are built one at a time. Finish three to unlock the Colossus.\nMegastructures finished: §Y[?hos_megastructures]§!"
 hos_colossus_category: "The Colossus"
 hos_colossus_category_desc: "Our Colossus hangs in orbit. Open the decisions map mode and pick any state controlled by a country we are at war with.\n\nEach shot angers every nation on Earth, and the Colossus takes 60 days to recharge."
 hos_galactic_crisis: "The Endgame Crisis"
 hos_galactic_crisis_desc: "Something from beyond has come for Earth. Every nation on the planet is at war with it, and whatever wars we were fighting before seem a lot less important."

 ### Decisions
 hos_embrace_new_ethos: "Embrace a New Ethos"
 hos_embrace_new_ethos_desc: "Consult the Stellaris Codex again and change what our nation believes in."
 hos_launch_satellite: "Launch a Satellite"
 hos_launch_satellite_desc: "The Codex has the blueprints. Our engineers have a large firework. Together, they could put a beeping metal ball into orbit about twenty years early."
 hos_build_spaceport: "Build an Orbital Spaceport"
 hos_build_spaceport_desc: "A station in orbit from which to build and launch our ships."
 hos_launch_science_ship: "Launch a Science Ship"
 hos_launch_science_ship_desc: "Send a science ship out to survey an anomaly. Who knows what it will find?"
 hos_launch_science_ship_tt: "Our science ship will survey an §Yanomaly§! and report back.\n"
 hos_colonize_moon: "Colonise the Moon"
 hos_colonize_moon_desc: "Plant our flag on the Moon before anyone else does."
 hos_research_jump_drives: "Research Jump Drives"
 hos_research_jump_drives_desc: "Fold space itself, and cross great distances in an instant."
 hos_jump_drive_warning_tt: "§RSomething on the other side of the fold has noticed us.§! (The Unbidden are more likely to be the endgame crisis.)\n"
 hos_build_dyson_sphere: "Build a Dyson Sphere"
 hos_build_dyson_sphere_desc: "Wrap the Sun in a shell and harvest its light for our factories. The other nations will need to buy their own Sun."
 hos_build_ring_world: "Build a Ring World"
 hos_build_ring_world_desc: "Build a habitable ring around the Sun, with room for more people than have ever lived. Needs the Lunar Colony."
 hos_build_science_nexus: "Build a Science Nexus"
 hos_build_science_nexus_desc: "An orbital research complex. Grants an extra research slot."
 hos_build_sentry_array: "Build a Sentry Array"
 hos_build_sentry_array_desc: "A web of telescopes and listening stations that sees everything on Earth."
 hos_build_matter_decompressor: "Build a Matter Decompressor"
 hos_build_matter_decompressor_desc: "Squeeze raw materials out of a black hole. We do not have a black hole, so the engineers are using a very dense part of the Moon."
 hos_build_art_installation: "Build a Mega Art Installation"
 hos_build_art_installation_desc: "Art. In space. Very large."
 hos_build_coordination_center: "Build a Strategic Coordination Center"
 hos_build_coordination_center_desc: "Link our whole army to a single orbital command station."
 hos_build_mega_shipyard: "Build a Mega Shipyard"
 hos_build_mega_shipyard_desc: "An orbital shipyard for the largest ships ever imagined."
 hos_build_gateway: "Build a Gateway Network"
 hos_build_gateway_desc: "Portals that move whole divisions in an instant. Needs Jump Drives."
 hos_build_colossus: "Build a Colossus"
 hos_build_colossus_desc: "A planet-killer. Every nation on Earth will know we are building it, and none of them will like it. Needs three finished megastructures."
 hos_become_the_crisis: "Become the Crisis"
 hos_become_the_crisis_desc: "Why defend the world from the end of the world, when we could be the end of the world?"
 hos_aetherophasic_engine: "Build the Aetherophasic Engine"
 hos_aetherophasic_engine_desc: "A machine that tears a hole in reality. When it is finished, every nation at war with us will simply stop existing. Every great power will declare war the moment we start."
 hos_aetherophasic_engine_tt: "§RAnnex every country at war with us.§!\n"
 hos_engine_war_tt: "Every AI great power will §Rdeclare war§! on us.\n"
 hos_colossus_fire: "Fire the Colossus at [FROM.GetName]"
 hos_colossus_fire_desc: "Point the planet-killer at [FROM.GetName] and press the big red button."
 hos_defender_of_the_galaxy_decision: "Defender of the Galaxy"
 hos_defender_of_the_galaxy_decision_desc: "Swear to stand against the crisis. Our troops deal and resist 50% more damage against it."
 hos_world_cracker_tt: "The Colossus will §Rshatter§! the target state: it becomes a wasteland, loses all its buildings and population, and the troops in it are wrecked.\n"
 hos_neutron_sweep_tt: "The Colossus will §Rsweep§! the target state with neutron radiation: its population and recruitable manpower are wiped out, and the troops in it are wrecked. The buildings are fine.\n"
 hos_nanobot_diffuser_tt: "The Colossus will §Yassimilate§! the target state: nanobots convert it, and it becomes ours, with a core.\n"
 hos_crisis_defender_tt: "Every country on Earth is now at war with the crisis. The §YDefender of the Galaxy§! decision gives +50% damage against it.\n"

 ### Ethics events
 hos_ethics.1.t: "The Stellaris Codex"
 hos_ethics.1.d: "A meteorite came down outside our capital this morning. Inside the crater, glowing faintly, our soldiers found a crystal the size of a suitcase.\n\nOur scientists have spent the night with it. They say it is a library: star charts, blueprints for things we have no words for, and a long, long treatise on how a civilisation among the stars should think. The word on the cover, as near as anyone can translate it, is §YStellaris§!.\n\nThe treatise starts with one question. Are we many minds, or one?"
 hos_ethics.1.a: "We are many. Show us the ethics."
 hos_ethics.1.b: "We are one."
 hos_ethics.1.c: "Put it in a museum and get back to the war."
 hos_ethics.2.t: "Choose Our Ethos"
 hos_ethics.2.d: "The Codex lists the great ideas that have guided civilisations across the galaxy. Our ministers have argued all night. It is time for [ROOT.GetLeader] to decide what [ROOT.GetNameDef] will stand for among the stars."
 hos_ethics.2.a: "Fanatic Militarist: strength is the measure of all things."
 hos_ethics.2.b: "Fanatic Pacifist: we will not start the war, but we will finish it."
 hos_ethics.2.c: "Fanatic Materialist: science will save us."
 hos_ethics.2.e: "Fanatic Spiritualist: the Shroud guides us."
 hos_ethics.2.f: "Fanatic Xenophobe: everyone else is a threat."
 hos_ethics.2.g: "Fanatic Xenophile: everyone else is a friend."
 hos_ethics.3.t: "A Gestalt Consciousness"
 hos_ethics.3.d: "The Codex describes civilisations that are not many people, but one: a single vast mind, made of flesh or of steel. Our scientists think we could become one too. Our scientists also look slightly too excited about it."
 hos_ethics.3.a: "Machine Intelligence: one great calculating engine runs everything."
 hos_ethics.3.b: "Hive Mind: we are one, we are many, we are hungry."

 ### Space events
 hos_space.1.t: "Beep. Beep. Beep."
 hos_space.1.d: "Our first satellite is in orbit, and every radio on Earth can hear it. Foreign ambassadors have been arriving at the foreign ministry all morning, asking whether it can see their military bases.\n\nIt can."
 hos_space.1.a: "Ad astra!"
 hos_space.2.t: "Orbital Spaceport Complete"
 hos_space.2.d: "Our first spaceport is open for business. Ships can now be built in orbit, out of reach of weather, gravity and enemy bombers. The canteen is already the most complained-about place in the armed forces."
 hos_space.2.a: "The stars are ours."
 hos_space.3.t: "One Small Step"
 hos_space.3.d: "Our colonists have landed on the Moon and planted the flag of [ROOT.GetNameDef]. The first lunar town has a school, a barracks and a very large window."
 hos_space.3.a: "One giant leap for [ROOT.GetAdjective]kind."
 hos_space.4.t: "The Fold"
 hos_space.4.d: "Our first jump drive works. A test ship vanished from orbit and reappeared over the far side of the Sun a second later.\n\nIt came back with something scratched into its hull, from the outside. Our scientists are calling it a micrometeorite pattern. They are not looking anyone in the eye."
 hos_space.4.a: "Probably micrometeorites."
 hos_space.10.t: "The Dyson Sphere"
 hos_space.10.d: "The last panel has been fixed in place. The Sun is now wrapped in our shell, and its energy flows straight into our factories.\n\nThe other nations of Earth have complained that it is getting rather dark. We have offered to sell them some light."
 hos_space.10.a: "Let there be power."
 hos_space.11.t: "The Ring World"
 hos_space.11.d: "The great ring around the Sun is finished. Its first settlers report endless fields, mild weather and a horizon that curves upwards, which takes a few weeks to get used to."
 hos_space.11.a: "Room for everyone."
 hos_space.12.t: "The Science Nexus"
 hos_space.12.d: "Our orbital research complex is open. Our finest minds are now working in perfect isolation, with nothing to distract them but the view of the Earth and each other."
 hos_space.12.a: "Think faster."
 hos_space.13.t: "The Sentry Array"
 hos_space.13.d: "The array is online. Our analysts can now count the buttons on a foreign general's coat from orbit. They have already found three generals wearing their coats inside out."
 hos_space.13.a: "We see everything."
 hos_space.14.t: "The Matter Decompressor"
 hos_space.14.d: "The decompressor is running, and raw materials are pouring out of it faster than our trains can carry them. Our engineers say it is quite safe. They have asked to be moved further away from it."
 hos_space.14.a: "More steel!"
 hos_space.15.t: "The Mega Art Installation"
 hos_space.15.d: "The great sculpture is finished. It is visible from every country on Earth, and it is, everyone agrees, very large. Nobody agrees what it is supposed to be. Our people love it anyway."
 hos_space.15.a: "Art!"
 hos_space.16.t: "The Strategic Coordination Center"
 hos_space.16.d: "Every division, every airfield and every staff officer is now linked to our orbital command station. Orders reach the front before the generals have finished giving them."
 hos_space.16.a: "Coordination achieved."
 hos_space.17.t: "The Mega Shipyard"
 hos_space.17.d: "The mega shipyard has launched its first ship, and then another, and then another. The navy has run out of names and is now using the names of admirals' pets."
 hos_space.17.a: "Launch them all."
 hos_space.18.t: "The Gateway Network"
 hos_space.18.d: "The first gateway shimmers into life. A test battalion walked into it at home and out of it on the far side of the country, slightly dizzy, three minutes later."
 hos_space.18.a: "Step through."

 ### Anomalies
 hos_anomaly.1.t: "Anomaly: Space Whales"
 hos_anomaly.1.d: "Our science ship has found a herd of Tiyanki: living creatures the size of a city, drifting slowly between the stars. One of them has taken an interest in our ship. It keeps nudging it, very gently, like a dog asking to be walked."
 hos_anomaly.1.a: "Its name is Gary now."
 hos_anomaly.1.b: "Dissect it, for science."
 hos_anomaly.2.t: "Anomaly: The Precursor Cache"
 hos_anomaly.2.d: "Buried on a frozen moon, our survey team has found a vault left by a civilisation that died before the dinosaurs. Inside is a library, perfectly preserved, and still switched on."
 hos_anomaly.2.a: "Download everything."
 hos_anomaly.2.b: "Leave it. Some doors should stay closed."
 hos_anomaly.3.t: "Anomaly: The Sentient Asteroid"
 hos_anomaly.3.d: "Our scientists insist that this asteroid is alive and has been trying to talk to us by changing the patterns of its crystal deposits. Translated, its messages so far are 'hello', 'hello' and 'why is everyone staring'."
 hos_anomaly.3.a: "Befriend the rock."
 hos_anomaly.3.b: "Mine the rock."
 hos_anomaly.4.t: "Anomaly: A Towel"
 hos_anomaly.4.d: "Floating in deep space, light years from anything, our science ship has found a towel. Just a towel. It is spotless and smells faintly of the sea. Woven into its border, in a thousand languages, are two words:\n\n§YDON'T PANIC§!"
 hos_anomaly.4.a: "We won't."
 hos_anomaly.5.t: "Anomaly: Grey Goo"
 hos_anomaly.5.d: "A cloud of self-replicating nanobots has latched onto our science ship. They are eating the hull. They are doing it politely and in neat rows, but they are definitely eating it."
 hos_anomaly.5.a: "Purge them, whatever it costs."
 hos_anomaly.5.b: "Bring a sample home to study."
 hos_anomaly.5.b.tt: "§YCould go either way.§!\n"
 hos_anomaly.51.t: "The Nanobots Are Ours"
 hos_anomaly.51.d: "Our engineers have tamed the sample. The nanobots now build what we tell them to, in neat polite rows."
 hos_anomaly.51.a: "Excellent."
 hos_anomaly.52.t: "The Nanobots Got Out"
 hos_anomaly.52.d: "The sample has escaped its container, and has eaten several factories in the capital before our engineers stopped it. In neat polite rows."
 hos_anomaly.52.a: "Who opened the jar?"
 hos_anomaly.6.t: "Anomaly: A Friendly Amoeba"
 hos_anomaly.6.d: "A space amoeba the size of a tram has followed our science ship home. It wobbles when it sees people. Our scientists believe this means it is happy."
 hos_anomaly.6.a: "Keep it. Breed more. Teach them to pull guns."
 hos_anomaly.6.b: "Shoo."
 hos_anomaly.7.t: "Anomaly: The Derelict"
 hos_anomaly.7.d: "Drifting among the asteroids, our science ship has found a warship of unknown design, long abandoned. Its weapons are cold, its crew long gone, and its tactical computer is still running war games against an enemy that no longer exists."
 hos_anomaly.7.a: "Study its war games."
 hos_anomaly.7.b: "Study its hull."
 hos_anomaly.8.t: "Anomaly: The Whispering Temple"
 hos_anomaly.8.d: "On a dead world, our survey team has found a temple older than any human city. At night it whispers. The whispers know the names of everyone on the team, and they seem to know a great deal about the economy."
 hos_anomaly.8.a: "Listen."
 hos_anomaly.8.b: "Seal it up and pour concrete on it."
 hos_anomaly.9.t: "Anomaly: The Horizon Signal"
 hos_anomaly.9.d: "Our science ship has picked up a signal from the edge of the solar system. It repeats one phrase, over and over, in perfect [ROOT.GetAdjective]:\n\n§YTHE WORM IS WAITING.§!\n\nNobody on the ship has slept since."
 hos_anomaly.9.a: "Follow the signal."
 hos_anomaly.9.b: "Turn the radio off."
 hos_anomaly.10.t: "Anomaly: An Ether Drake"
 hos_anomaly.10.d: "Our science ship has woken something up. A dragon, made of crystal and lightning and very bad temper, has uncurled from the asteroid it was sleeping on and is looking at us."
 hos_anomaly.10.a: "Scramble the fighters!"
 hos_anomaly.10.a.tt: "§YWe might win.§!\n"
 hos_anomaly.10.b: "Run."
 hos_anomaly.101.t: "The Drake Falls"
 hos_anomaly.101.d: "After a battle that lit up the night sky, our pilots have brought down the Ether Drake. Its hoard is being counted. Its head is going in the officers' mess."
 hos_anomaly.101.a: "Dragon slayers!"
 hos_anomaly.102.t: "The Drake Burns the Capital"
 hos_anomaly.102.d: "Our fighters did not stop the Ether Drake. It followed them home, burned the airfields outside the capital, and then flew off into space, apparently satisfied."
 hos_anomaly.102.a: "We will not speak of this."
 hos_anomaly.99.t: "Anomaly: Nothing of Interest"
 hos_anomaly.99.d: "Our science ship has surveyed the anomaly and found nothing of interest. The science team insists that it was 'a really interesting rock', and has brought it back."
 hos_anomaly.99.a: "A really interesting rock."

 ### Colossus events
 hos_colossus.1.t: "[hos_colossus_user.GetNameDefCap] Is Building a Colossus"
 hos_colossus.1.d: "Our intelligence services report that [hos_colossus_user.GetNameDef] has begun building a Colossus: a machine in orbit that can destroy, sterilise or swallow a whole region from space. Nobody knows who they plan to point it at, which is the worrying part."
 hos_colossus.1.a: "This is very bad news."
 hos_colossus.1.b: "Let them worry."
 hos_colossus.2.t: "The Colossus Is Complete"
 hos_colossus.2.d: "Our Colossus hangs over the world. Its engineers need to know one last thing: what should it do when we fire it?"
 hos_colossus.2.a: "World Cracker: break the land apart."
 hos_colossus.2.b: "Neutron Sweep: kill everything, keep the buildings."
 hos_colossus.2.c: "Nanobot Diffuser: make them ours."
 hos_colossus.10.t: "A World Cracked"
 hos_colossus.10.d: "[hos_colossus_user.GetNameDefCap] has fired its Colossus at a state of [hos_colossus_victim.GetNameDef]. Witnesses describe a beam of light, an earthquake felt on every continent, and then silence.\n\nCartographers have given up trying to draw what is left. It is now marked on maps as [hos_colossus_target.GetName]."
 hos_colossus.10.a: "Dear God."
 hos_colossus.11.t: "A Neutron Sweep"
 hos_colossus.11.d: "[hos_colossus_user.GetNameDefCap] has fired its Colossus at [hos_colossus_target.GetName], in [hos_colossus_victim.GetNameDef]. There was no explosion and no fire. The streets are untouched, the lights are still on, and nobody is left alive."
 hos_colossus.11.a: "Horrifying."
 hos_colossus.12.t: "Nanobots Over [hos_colossus_target.GetName]"
 hos_colossus.12.d: "[hos_colossus_user.GetNameDefCap] has fired its Colossus at [hos_colossus_target.GetName], in [hos_colossus_victim.GetNameDef]. A silver mist settled over the region, and by morning the locals were flying [hos_colossus_user.GetAdjective] flags and could not remember why they ever hadn't."
 hos_colossus.12.a: "That's creepy."
 hos_colossus.20.t: "A Galactic Nemesis Rises"
 hos_colossus.20.d: "[hos_nemesis.GetNameDefCap] has stopped pretending. Its leader has announced, on every radio frequency at once, that the world will be unmade and remade in its image. It has a Colossus, and it has every intention of using it."
 hos_colossus.20.a: "They must be stopped."
 hos_colossus.20.b: "Let them tremble."
 hos_colossus.21.t: "The Aetherophasic Engine"
 hos_colossus.21.d: "[hos_nemesis.GetNameDefCap] has started building a machine that tears a hole in reality. Physicists across the world agree that if it is finished, every nation at war with [hos_nemesis.GetNameDef] will simply cease to exist.\n\nThe great powers of the world have declared war. There is no time left for anything else."
 hos_colossus.21.a: "To war, before it is too late!"
 hos_colossus.21.b: "We can only hope they stop it."
 hos_colossus.21.c: "It is only a matter of time."
 hos_colossus.22.t: "The End of the Cycle"
 hos_colossus.22.d: "The Aetherophasic Engine has fired. Every nation that stood against [hos_nemesis.GetNameDef] is gone, folded into it like it was never anything else.\n\nThe world is quieter now."
 hos_colossus.22.a: "What have they done?"
 hos_colossus.22.b: "The cycle ends with us."

 ### Crisis events
 hos_crisis.1.t: "Something Is Coming"
 hos_crisis.1.d: "Observatories across the world report thousands of objects decelerating towards Earth from beyond the galaxy. They are not rocks. They are changing course to avoid each other.\n\nAt the edge of the solar system, a radio telescope has picked up a sound none of the astronomers can describe, except to say that it sounds hungry."
 hos_crisis.1.a: "What could possibly go wrong?"
 hos_crisis.2.t: "Reality Is Thinning"
 hos_crisis.2.d: "Physicists in a dozen countries report the same thing: their instruments say the fabric of space itself is vibrating, 'like a drum someone is hitting from the other side'.\n\nIn one laboratory, the vacuum in a sealed chamber has begun to glow."
 hos_crisis.2.a: "Someone tell them to stop hitting it."
 hos_crisis.3.t: "The Machines Are Restless"
 hos_crisis.3.d: "Telegraph machines, calculating engines and radio sets across the world have begun printing, at the same moment, the same word. Engineers have unplugged them. Some of them have kept printing.\n\nThe word is §RSTERILIZE§!."
 hos_crisis.3.a: "Probably a fault on the line."
 hos_crisis.11.t: "The Prethoryn Scourge"
 hos_crisis.11.d: "They are here. Swarms of living ships have plunged out of the sky and landed on three coasts, and from them pours an endless tide of creatures that eat everything in their path: crops, forests, cities, armies.\n\nThe Prethoryn Scourge does not negotiate, and it does not stop. Every nation on Earth is at war with it."
 hos_crisis.11.a: "The world must stand together!"
 hos_crisis.11.b: "Consume."
 hos_crisis.12.t: "The Unbidden"
 hos_crisis.12.d: "A portal has torn open, and from it march the Unbidden: beings of pure energy from another universe, who see ours as something to eat. They have taken the land around their portal and are spreading out from it.\n\nRetake the portal, and they will be cut off from their home. Every nation on Earth is at war with them."
 hos_crisis.12.a: "Close the portal!"
 hos_crisis.12.b: "Feed."
 hos_crisis.13.t: "The Contingency"
 hos_crisis.13.d: "It was not a fault on the line. A machine intelligence, built long ago to sterilise any galaxy where organic life grows out of control, has woken inside our own factories. Its sterilization hubs have seized regions of four great powers, and their war machines are already marching.\n\nDestroy the hubs, and the machines will falter. Every nation on Earth is at war with it."
 hos_crisis.13.a: "Pull the plug!"
 hos_crisis.13.b: "Commence sterilization."
 hos_crisis.20.a: "Consume."
 hos_crisis.21.t: "Our Machines Betray Us"
 hos_crisis.21.d: "Our Machine Intelligence has always been loyal. But the Contingency spoke to it in a language older than humanity, and part of it listened. A whole region of [ROOT.GetNameDef] has gone dark, and the machines there are now marching against us."
 hos_crisis.21.a: "Traitor code!"
 hos_crisis.30.t: "The Portal Collapses"
 hos_crisis.30.d: "The Unbidden portal has been retaken and destroyed. The beings still in our universe are cut off from their home, and they are weakening. They will not be reinforced."
 hos_crisis.30.a: "Now finish them!"
 hos_crisis.31.t: "The Hubs Are Destroyed"
 hos_crisis.31.d: "The last Contingency sterilization hub has been retaken. Without them, the Contingency's war machines are slow and confused, and they are no longer being reinforced."
 hos_crisis.31.a: "Now finish them!"
 hos_crisis.40.t: "The Crisis Is Over"
 hos_crisis.40.d: "It is finished. The last remnants of the invaders have been destroyed, and the world is, against all odds, still here.\n\nThe nations that fought it are battered, exhausted and very proud of themselves. Somewhere, a general is already asking whether we could build a Colossus of our own, just in case."
 hos_crisis.40.a: "We survived the end of the world."

